[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -s -p no:pytest_playwright --alluredir=reports/allure-results
markers =
    smoke: fast smoke tests
    sanity: focused confidence checks
    regression: full regression coverage
    api: API-focused tests
    ui: browser-based UI tests
    e2e: end-to-end user workflows
    login: authentication and login coverage
    pim: employee and PIM coverage
    critical: business-critical coverage
    negative: invalid, failure, or error-path coverage
    integration: tests spanning multiple application layers
    hybrid: tests combining API and UI workflows
    destructive: tests that mutate shared application data
    visual: visual-regression tests
    accessibility: accessibility-focused tests
    flaky: temporarily unstable tests requiring explicit retry policy
log_cli = true
log_cli_level = INFO
